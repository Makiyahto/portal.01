<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BSIT 1-3 Section Portal</title>
  <meta name="description" content="Class schedule, links, and resources for BSIT 1-3, Cavite State University.">
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxZDZhM2EiLz48cGF0aCBkPSJNMTQgMjJoMzZNMTQgMzJoMzZNMTQgNDJoMjIiIHN0cm9rZT0iI2UyYjQzYyIgc3Ryb2tlLXdpZHRoPSI2IiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48L3N2Zz4K" type="image/svg+xml">
  <style>
/* ===== Theme tokens ===== */
:root {
  --bg: #f5f6f0;
  --surface: #ffffff;
  --ink: #17231b;
  --muted: #5b6a60;
  --accent: #1d6a3a;
  --on-accent: #ffffff;
  --gold: #e2b43c;
  --line: #dfe3d8;
  --radius: 10px;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"] {
  --bg: #0e1712;
  --surface: #15221a;
  --ink: #e8efe9;
  --muted: #9db0a2;
  --accent: #5fbf86;
  --on-accent: #0e1712;
  --line: #24362b;
}

/* ===== Base ===== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 4.5rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 1rem/1.6 var(--sans);
}
h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; }
h1 { font-size: clamp(2rem, 7vw, 3.25rem); }
h2 { font-size: 1.5rem; margin-bottom: 1rem; }
p { margin: 0; }
a { color: var(--accent); }
.muted { color: var(--muted); }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

main, .top, footer { width: min(100% - 2rem, 64rem); margin-inline: auto; }
section { padding-block: 2rem; }

/* ===== Header ===== */
.top {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  padding-block: 0.75rem;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.brand { font: 700 1.2rem var(--serif); color: var(--ink); text-decoration: none; }
.top nav { display: none; gap: 1.25rem; margin-left: auto; }
.top nav a { color: var(--ink); text-decoration: none; }
.top nav a:hover { color: var(--accent); }
.icon-btn {
  display: grid; place-items: center;
  width: 2.5rem; height: 2.5rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 50%;
  cursor: pointer;
}
.icon-btn svg, .card .icon svg { width: 1.25rem; height: 1.25rem; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Hero ===== */
.hero { display: grid; gap: 1.5rem; padding-block: 2.5rem 1rem; }
.hero p { margin-top: 0.75rem; max-width: 36rem; color: var(--muted); }
.today { background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--gold); border-radius: var(--radius); padding: 1rem 1.25rem; }
.today h2 { margin-bottom: 0; font-size: 1.25rem; }
.today .sched { margin-top: 0.75rem; }

/* ===== Cards ===== */
.grid { display: grid; gap: 0.75rem; grid-template-columns: 1fr; }
.card {
  display: flex; gap: 0.9rem; align-items: flex-start;
  padding: 1rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none;
}
a.card:hover { border-color: var(--accent); }
.card .icon { display: grid; place-items: center; flex: none; width: 2.5rem; height: 2.5rem; border-radius: 8px; background: var(--accent); color: var(--on-accent); }
.card h3 { font-size: 1.05rem; }
.card p { color: var(--muted); font-size: 0.92rem; }

/* ===== Schedule ===== */
.tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.tab {
  padding: 0.5rem 1rem;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 999px;
  font: inherit; cursor: pointer;
}
.tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.sched { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.6rem; }
.sched li {
  display: grid; grid-template-columns: 8.5rem 1fr; gap: 0.25rem 1rem;
  padding: 0.75rem 1rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
.sched .time { color: var(--muted); font-size: 0.9rem; }
.sched .code { font-weight: 600; }
.sched .room { grid-column: 2; color: var(--muted); font-size: 0.92rem; }
.empty { color: var(--muted); }

footer { padding-block: 2rem; color: var(--muted); font-size: 0.9rem; border-top: 1px solid var(--line); }

/* ===== Larger screens ===== */
@media (min-width: 700px) {
  .top nav { display: flex; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .hero { grid-template-columns: 1.3fr 1fr; align-items: center; }
}
@media (min-width: 960px) {
  .grid { grid-template-columns: repeat(3, 1fr); }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="#top">BSIT 1-3</a>
    <nav aria-label="Page sections">
      <a href="#quick">Quick access</a>
      <a href="#schedule">Schedule</a>
      <a href="#resources">Resources</a>
      <a href="#members">Members</a>
    </nav>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Toggle dark mode"></button>
  </header>

  <main id="top">
    <section class="hero">
      <div>
        <h1>BSIT 1-3 Section Portal</h1>
        <p>Schedule, links, and resources for our section at Cavite State University – Main Campus.</p>
      </div>
      <aside class="today" aria-labelledby="today-title">
        <h2 id="today-title">Today</h2>
        <p id="today-date" class="muted"></p>
        <ul id="today-list" class="sched"></ul>
      </aside>
    </section>

    <section id="quick">
      <h2>Quick access</h2>
      <div id="quick-list" class="grid"></div>
    </section>

    <section id="schedule">
      <h2>Class schedule</h2>
      <div id="day-tabs" class="tabs" role="tablist" aria-label="Day of the week"></div>
      <ul id="schedule-list" class="sched"></ul>
    </section>

    <section id="resources">
      <h2>Resources</h2>
      <div id="resource-list" class="grid"></div>
    </section>

    <section id="members">
      <h2>Members</h2>
      <div id="member-list" class="grid"></div>
    </section>
  </main>

  <footer>
    <p>BSIT 1-3 · Cavite State University – Main Campus</p>
  </footer>

  <script>
/* ==========================================================
   BSIT 1-3 Section Portal
   Edit the DATA section below. The rest renders it.
   ========================================================== */

// ===== DATA =====
const quickLinks = [
  { icon: "calendar", title: "Class schedule", text: "Rooms and times per day", href: "#schedule" },
  { icon: "folder", title: "Resources", text: "Modules, slides, and notes", href: "#resources" },
  { icon: "users", title: "Members", text: "Who's in our section", href: "#members" },
];

const schedule = [
  {
    day: "Monday",
    classes: [
      { code: "DCIT 22", room: "ITC 201", time: "7:00 – 8:00 AM" },
      { code: "CVSU 101", room: "TBA", time: "8:00 – 9:00 AM" },
      { code: "DCIT 22", room: "CCL 204", time: "10:00 AM – 1:00 PM" },
      { code: "DCIT 21", room: "CCL 102", time: "3:00 – 5:00 PM" },
      { code: "GNED 11", room: "LH101 CAS", time: "5:00 – 7:00 PM" },
    ],
  },
  {
    day: "Tuesday",
    classes: [
      { code: "FITT", room: "GYM", time: "7:00 – 9:00 AM" },
      { code: "GNED 02", room: "LH 305b CAS", time: "11:00 AM – 1:00 PM" },
    ],
  },
  {
    day: "Wednesday",
    classes: [
      { code: "COSC 50", room: "ITC 408", time: "7:00 – 9:00 AM" },
      { code: "DCIT 22", room: "CCL 102", time: "10:00 AM – 1:00 PM" },
      { code: "GNED 05", room: "CAFENR 105", time: "3:00 – 5:00 PM" },
      { code: "DCIT 21", room: "ITC 408", time: "5:00 – 7:00 PM" },
    ],
  },
];

const resources = [
  { icon: "book", title: "Course modules", text: "Replace with your drive link", href: "#resources" },
  { icon: "link", title: "Class group", text: "Replace with your group link", href: "#resources" },
  { icon: "folder", title: "Shared files", text: "Replace with your folder link", href: "#resources" },
];

const members = [
  { icon: "users", title: "Student Name", text: "President" },
  { icon: "users", title: "Student Name", text: "Vice President" },
  { icon: "users", title: "Student Name", text: "Secretary" },
];

// ===== ICONS (24x24, stroke-based) =====
const icons = {
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2 20a7 7 0 0 1 14 0M16 4.5a3.5 3.5 0 0 1 0 7M22 20a7 7 0 0 0-4-6.3"/>',
  book: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/>',
  link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
};
const svg = (name) => `<svg viewBox="0 0 24 24" aria-hidden="true">${icons[name] || ""}</svg>`;

// ===== RENDER: cards =====
function renderCards(containerId, items) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = items
    .map((i) => {
      const tag = i.href ? "a" : "div";
      const href = i.href ? ` href="${i.href}"` : "";
      return `<${tag} class="card"${href}>
        <span class="icon">${svg(i.icon)}</span>
        <div><h3>${i.title}</h3><p>${i.text}</p></div>
      </${tag}>`;
    })
    .join("");
}

// ===== RENDER: schedule =====
const classRows = (classes) =>
  classes.length
    ? classes
        .map(
          (c) => `<li>
            <span class="time">${c.time}</span>
            <span class="code">${c.code}</span>
            <span class="room">${c.room}</span>
          </li>`
        )
        .join("")
    : '<li class="empty">No classes.</li>';

function renderSchedule() {
  const tabs = document.getElementById("day-tabs");
  const list = document.getElementById("schedule-list");
  if (!tabs || !list) return;

  const today = new Date().toLocaleDateString("en-US", { weekday: "long" });
  let selected = schedule.find((d) => d.day === today) || schedule[0];

  const draw = () => {
    tabs.innerHTML = schedule
      .map(
        (d) => `<button class="tab" role="tab" type="button" data-day="${d.day}"
          aria-selected="${d.day === selected.day}">${d.day}${d.day === today ? " (today)" : ""}</button>`
      )
      .join("");
    list.innerHTML = classRows(selected.classes);
  };

  tabs.addEventListener("click", (e) => {
    const btn = e.target.closest(".tab");
    if (!btn) return;
    selected = schedule.find((d) => d.day === btn.dataset.day);
    draw();
  });
  draw();
}

// ===== RENDER: today panel =====
function renderToday() {
  const now = new Date();
  const dayName = now.toLocaleDateString("en-US", { weekday: "long" });
  const dateEl = document.getElementById("today-date");
  const listEl = document.getElementById("today-list");
  if (dateEl) dateEl.textContent = now.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  const day = schedule.find((d) => d.day === dayName);
  if (listEl) listEl.innerHTML = classRows(day ? day.classes : []);
}

// ===== THEME =====
function initTheme() {
  const btn = document.getElementById("theme-toggle");
  let saved = null;
  try { saved = localStorage.getItem("theme"); } catch (e) {}
  const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = saved || (prefersDark ? "dark" : "light");

  const apply = () => {
    document.documentElement.setAttribute("data-theme", theme);
    if (btn) btn.innerHTML = svg(theme === "dark" ? "sun" : "moon");
  };
  apply();

  if (btn) {
    btn.addEventListener("click", () => {
      theme = theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", theme); } catch (e) {}
      apply();
    });
  }
}

// ===== INIT =====
renderCards("quick-list", quickLinks);
renderCards("resource-list", resources);
renderCards("member-list", members);
renderSchedule();
renderToday();
initTheme();
</script>
</body>
</html>
